<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Farm Monitor</title>
<link rel="manifest" href="/manifest.json">
<style>
:root {
  --bg:        #0d1117;
  --bg-card:   #161b22;
  --bg-card2:  #1c2128;
  --border:    #30363d;
  --text:      #e6edf3;
  --dim:       #8b949e;
  --green:     #3fb950;
  --yellow:    #d29922;
  --red:       #f85149;
  --blue:      #388bfd;
  --purple:    #bc8cff;
  --teal:      #2dd4bf;
  --orange:    #f0883e;
  --pad: env(safe-area-inset-top, 0px);
  --bot: env(safe-area-inset-bottom, 0px);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'SF Mono', 'Fira Code', 'Consolas', 'Menlo', monospace;
  font-size: 13px;
  overflow: hidden;
}

#app { display: flex; flex-direction: column; height: 100%; }

/* ── Header ── */
#header {
  padding: calc(var(--pad) + 10px) 14px 8px;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 48px;
  flex-shrink: 0;
  position: relative;
}

#back-btn {
  background: none; border: 1px solid var(--border); color: var(--teal);
  padding: 4px 10px; border-radius: 4px; cursor: pointer; font: inherit;
  font-size: 12px; white-space: nowrap;
}
#back-btn:active { background: var(--bg-card2); }

#header-title {
  font-size: 13px; font-weight: 700; letter-spacing: 0.08em;
  color: var(--teal); text-transform: uppercase; flex: 1;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

#header-right {
  display: flex; flex-direction: column; align-items: flex-end;
  gap: 1px; flex-shrink: 0;
}
#clock { font-size: 12px; color: var(--text); font-variant-numeric: tabular-nums; }
#status-line { font-size: 10px; color: var(--dim); white-space: nowrap; }

/* ── Scroll area ── */
#content {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 10px 10px calc(var(--bot) + 10px);
}

/* ── Node card (summary) ── */
.node-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 10px;
  padding: 10px 12px 8px;
  cursor: pointer;
  transition: border-color 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.node-card:active { border-color: var(--teal); background: var(--bg-card2); }
.node-card.dead { border-color: var(--border); opacity: 0.65; }

.card-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 8px;
}
.node-name { font-weight: 700; font-size: 13px; color: var(--text); }
.status-badge {
  font-size: 10px; padding: 2px 7px; border-radius: 3px; font-weight: 600;
  letter-spacing: 0.05em;
}
.status-badge.alive { background: #1a2f1e; color: var(--green); }
.status-badge.dead  { background: #2a1515; color: var(--red); }

.metric-row {
  display: grid;
  grid-template-columns: 38px 1fr auto;
  align-items: center;
  gap: 6px;
  margin-bottom: 5px;
}
.metric-label { font-size: 10px; color: var(--dim); text-align: right; }
.metric-val { font-size: 11px; color: var(--dim); white-space: nowrap; }

/* ── Bar ── */
.bar-track {
  height: 6px; background: #21262d; border-radius: 3px; overflow: hidden;
}
.bar-track.tall { height: 10px; border-radius: 4px; }
.bar-fill {
  height: 100%; border-radius: inherit;
  transition: width 0.6s ease, background-color 0.6s ease;
}

/* ── Sparkline ── */
.sparkline-wrap {
  margin-top: 6px; height: 36px; border-top: 1px solid #21262d;
  padding-top: 4px;
}
.sparkline-wrap svg { width: 100%; height: 30px; display: block; }

/* ── Section panel (detail) ── */
.panel {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 10px;
  overflow: hidden;
}
.panel-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 7px 12px;
  background: var(--bg-card2);
  border-bottom: 1px solid var(--border);
}
.panel-title {
  font-size: 11px; font-weight: 700; letter-spacing: 0.12em;
  color: var(--teal); text-transform: uppercase;
}
.panel-val { font-size: 12px; font-weight: 600; }
.panel-body { padding: 10px 12px; }

/* ── Detail sparkline (taller) ── */
.detail-sparkline { margin-bottom: 8px; height: 52px; }
.detail-sparkline svg { width: 100%; height: 52px; display: block; }

/* ── Per-core grid ── */
.core-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 4px 8px;
  margin-top: 6px;
}
.core-grid.wide { grid-template-columns: repeat(4, 1fr); }
.core-item {
  display: grid;
  grid-template-columns: 22px 1fr 28px;
  align-items: center;
  gap: 4px;
}
.core-idx { font-size: 9px; color: var(--dim); text-align: right; }
.core-pct { font-size: 9px; color: var(--dim); }

/* ── Processes table ── */
.proc-table { width: 100%; border-collapse: collapse; }
.proc-table th {
  text-align: left; font-size: 10px; color: var(--dim);
  padding: 3px 4px; border-bottom: 1px solid var(--border);
  font-weight: 600; letter-spacing: 0.05em;
}
.proc-table td { padding: 3px 4px; font-size: 11px; }
.proc-table tr:nth-child(even) td { background: #1a1f26; }
.proc-name { max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.proc-cpu { color: var(--green); font-variant-numeric: tabular-nums; }
.proc-mem { color: var(--purple); font-variant-numeric: tabular-nums; }

/* ── Meta row (temp, load, freq) ── */
.meta-row {
  display: flex; flex-wrap: wrap; gap: 10px;
  margin-top: 6px; font-size: 11px; color: var(--dim);
}
.meta-tag { display: flex; align-items: center; gap: 3px; }
.meta-tag .hi { color: var(--red); }
.meta-tag .med { color: var(--yellow); }
.meta-tag .ok { color: var(--green); }

/* ── Empty / error states ── */
.empty-state {
  text-align: center; padding: 60px 20px; color: var(--dim);
}
.empty-state .big { font-size: 32px; margin-bottom: 12px; }
.empty-state p { font-size: 12px; line-height: 1.7; }
.empty-state code {
  background: var(--bg-card2); padding: 2px 6px; border-radius: 3px;
  color: var(--teal); font: inherit;
}

.dead-msg { font-size: 11px; color: var(--red); padding: 4px 0; }

/* ── Pulse dot ── */
.pulse {
  display: inline-block; width: 7px; height: 7px; border-radius: 50%;
  flex-shrink: 0;
}
.pulse.alive { background: var(--green); box-shadow: 0 0 0 0 rgba(63,185,80,0.5);
  animation: pulse-a 2s infinite; }
.pulse.dead  { background: var(--red); }
@keyframes pulse-a {
  0%   { box-shadow: 0 0 0 0 rgba(63,185,80,0.5); }
  70%  { box-shadow: 0 0 0 5px rgba(63,185,80,0); }
  100% { box-shadow: 0 0 0 0 rgba(63,185,80,0); }
}

/* ── Temp color helpers ── */
.t-ok  { color: var(--green); }
.t-med { color: var(--yellow); }
.t-hi  { color: var(--red); }

/* ── Divider ── */
.divider { border: none; border-top: 1px solid var(--border); margin: 8px 0; }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <button id="back-btn" style="display:none" onclick="showSummary()">← BACK</button>
    <div id="header-title">FARM MONITOR</div>
    <div id="header-right">
      <span id="clock"></span>
      <span id="status-line">connecting…</span>
    </div>
  </div>
  <div id="content"></div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let nodes = [];
let currentNodeId = null;
let summaryTimer = null;
let detailTimer = null;
let lastUpdate = null;

// ── Utilities ──────────────────────────────────────────────────────────────
function fmtBytes(b) {
  if (!b) return '0B';
  if (b >= 1099511627776) return (b / 1099511627776).toFixed(1) + 'T';
  if (b >= 1073741824)    return (b / 1073741824).toFixed(1) + 'G';
  if (b >= 1048576)       return (b / 1048576).toFixed(1) + 'M';
  return b + 'B';
}

function usageColor(pct) {
  if (pct == null) return '#555';
  if (pct < 60) return 'var(--green)';
  if (pct < 80) return 'var(--yellow)';
  return 'var(--red)';
}

function tempColor(t) {
  if (t == null) return '';
  if (t < 60) return 't-ok';
  if (t < 80) return 't-med';
  return 't-hi';
}

function fmtAge(ts) {
  if (!ts) return '—';
  const s = Math.round((Date.now() - ts) / 1000);
  if (s < 5)  return 'now';
  if (s < 60) return s + 's ago';
  return Math.round(s / 60) + 'm ago';
}

function fmtPct(v) {
  return v != null ? v.toFixed(1) + '%' : '—';
}

// ── Sparkline ─────────────────────────────────────────────────────────────
function sparkline(data, color, h = 30) {
  if (!data || data.length < 2) return '';
  const w = 200, pad = 1;
  const n = data.length;
  const xStep = (w - pad * 2) / Math.max(n - 1, 1);

  const pts = data.map((v, i) => {
    const x = pad + i * xStep;
    const y = pad + (h - pad * 2) * (1 - Math.min(v, 100) / 100);
    return x.toFixed(1) + ',' + y.toFixed(1);
  });

  const last = pts[pts.length - 1].split(',');
  const polyFill = '0,' + h + ' ' + pts.join(' ') + ' ' + (pad + (n - 1) * xStep).toFixed(1) + ',' + h;

  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
    <polygon points="${polyFill}" fill="${color}" fill-opacity="0.12"/>
    <polyline points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="2.5" fill="${color}"/>
  </svg>`;
}

// ── Bar HTML ───────────────────────────────────────────────────────────────
function bar(pct, color, tall = false) {
  const w = Math.min(Math.max(pct || 0, 0), 100).toFixed(1);
  return `<div class="bar-track${tall ? ' tall' : ''}">
    <div class="bar-fill" style="width:${w}%;background:${color || usageColor(pct)}"></div>
  </div>`;
}

// ── Summary view ───────────────────────────────────────────────────────────
function renderSummary(nodes) {
  const el = document.getElementById('content');
  if (!nodes.length) {
    el.innerHTML = `<div class="empty-state">
      <div class="big">🖥️</div>
      <p>No nodes configured.<br><br>
      Set the <code>FARM_NODES</code> environment variable:<br>
      <code>gpu-node-1:100.64.0.1,cpu-node-1:100.64.0.5</code><br><br>
      Then install the agent on each node with <code>agent/install_agent.sh</code></p>
    </div>`;
    return;
  }

  el.innerHTML = nodes.map(n => renderNodeCard(n)).join('');

  // Attach click listeners
  el.querySelectorAll('.node-card[data-id]').forEach(card => {
    card.addEventListener('click', () => showDetail(card.dataset.id));
  });
}

function renderNodeCard(n) {
  const alive = n.alive;
  const m = n.metrics;
  const hist = n.history || {};

  let body = '';
  if (!alive) {
    body = `<div class="dead-msg">⚠ Unreachable${n.error ? ' — ' + n.error : ''}</div>`;
  } else if (m) {
    const cpu = m.cpu || {};
    const mem = m.memory || {};
    const gpus = m.gpus || [];
    const cpuPct = cpu.overall ?? 0;
    const memPct = mem.percent ?? 0;

    body += `<div class="metric-row">
      <span class="metric-label">CPU</span>
      ${bar(cpuPct)}
      <span class="metric-val" style="color:${usageColor(cpuPct)}">${fmtPct(cpuPct)}</span>
    </div>`;

    body += `<div class="metric-row">
      <span class="metric-label">MEM</span>
      ${bar(memPct, 'var(--purple)')}
      <span class="metric-val" style="color:var(--purple)">${fmtBytes(mem.used)}/${fmtBytes(mem.total)}</span>
    </div>`;

    gpus.forEach(g => {
      const gPct = g.util_pct ?? 0;
      const gMemPct = g.mem_total_mb ? (g.mem_used_mb / g.mem_total_mb) * 100 : 0;
      const shortName = (g.name || 'GPU').replace('NVIDIA GeForce ', '').replace('NVIDIA ', '');
      const label = gpus.length > 1 ? 'GPU' + g.index : 'GPU';
      body += `<div class="metric-row">
        <span class="metric-label">${label}</span>
        ${bar(gPct, 'var(--blue)')}
        <span class="metric-val" style="color:var(--blue)">${fmtPct(gPct)}</span>
      </div>
      <div class="metric-row">
        <span class="metric-label" style="font-size:9px">${shortName}</span>
        ${bar(gMemPct, 'var(--teal)')}
        <span class="metric-val" style="color:var(--teal)">${fmtBytes((g.mem_used_mb||0)*1048576)}/${fmtBytes((g.mem_total_mb||0)*1048576)}</span>
      </div>`;
    });

    // Footer meta: temp + load
    const metas = [];
    if (cpu.temp_c != null) metas.push(`<span class="meta-tag"><span class="${tempColor(cpu.temp_c)}">${cpu.temp_c}°C</span></span>`);
    if (cpu.load_avg) metas.push(`<span class="meta-tag" style="color:var(--dim)">load ${cpu.load_avg[0]}</span>`);
    if (cpu.count)   metas.push(`<span class="meta-tag" style="color:var(--dim)">${cpu.count}c</span>`);
    if (metas.length) body += `<div class="meta-row" style="margin-top:5px">${metas.join('')}</div>`;

    // CPU sparkline
    if (hist.cpu && hist.cpu.length > 2) {
      body += `<div class="sparkline-wrap">${sparkline(hist.cpu, 'var(--green)', 28)}</div>`;
    }
  }

  const age = n.lastPoll ? fmtAge(n.lastPoll) : '—';
  return `<div class="node-card${alive ? '' : ' dead'}" data-id="${n.id}">
    <div class="card-header">
      <span class="node-name">${esc(n.name)}</span>
      <div style="display:flex;align-items:center;gap:6px">
        <span class="dim" style="font-size:10px;color:var(--dim)">${age}</span>
        <span class="status-badge ${alive ? 'alive' : 'dead'}">${alive ? '● ALIVE' : '● DEAD'}</span>
      </div>
    </div>
    ${body}
  </div>`;
}

// ── Detail view ────────────────────────────────────────────────────────────
function renderDetail(n) {
  const el = document.getElementById('content');
  document.getElementById('header-title').textContent = n.name.toUpperCase();

  if (!n.alive) {
    el.innerHTML = `<div class="panel">
      <div class="panel-head">
        <span class="panel-title">STATUS</span>
        <span class="panel-val" style="color:var(--red)">UNREACHABLE</span>
      </div>
      <div class="panel-body">
        <p style="color:var(--dim);font-size:12px">
          ${n.error || 'Cannot connect to metrics agent'}<br><br>
          IP: <span style="color:var(--teal)">${esc(n.ip)}</span> · Port: ${getMetricsPort()}
        </p>
      </div>
    </div>`;
    return;
  }

  const m = n.metrics;
  if (!m) { el.innerHTML = '<div class="empty-state"><p>Loading…</p></div>'; return; }

  const cpu = m.cpu || {};
  const mem = m.memory || {};
  const gpus = m.gpus || [];
  const procs = m.processes || [];
  const hist = n.history || {};
  let html = '';

  // ── CPU panel ──
  const cpuPct = cpu.overall ?? 0;
  const cpuMetas = [];
  if (cpu.temp_c != null) cpuMetas.push(`<span class="${tempColor(cpu.temp_c)}">${cpu.temp_c}°C</span>`);
  if (cpu.load_avg) cpuMetas.push(`load ${cpu.load_avg.map(v => v.toFixed(2)).join(' / ')}`);
  if (cpu.freq_mhz) cpuMetas.push(`${(cpu.freq_mhz/1000).toFixed(2)} GHz`);
  if (cpu.count)    cpuMetas.push(`${cpu.count} cores`);

  html += `<div class="panel">
    <div class="panel-head">
      <span class="panel-title">CPU</span>
      <span class="panel-val" style="color:${usageColor(cpuPct)}">${fmtPct(cpuPct)}</span>
    </div>
    <div class="panel-body">`;

  if (hist.cpu && hist.cpu.length > 2) {
    html += `<div class="detail-sparkline">${sparkline(hist.cpu, usageColor(cpuPct), 50)}</div>`;
  }

  html += `${bar(cpuPct, null, true)}`;
  if (cpuMetas.length) html += `<div class="meta-row" style="margin-top:8px">${cpuMetas.map(s=>`<span>${s}</span>`).join('')}</div>`;

  // Per-core grid
  if (cpu.per_core && cpu.per_core.length > 0) {
    const cols = cpu.per_core.length > 16 ? 'wide' : '';
    html += `<div class="core-grid ${cols}" style="margin-top:10px">`;
    cpu.per_core.forEach((v, i) => {
      const c = usageColor(v);
      html += `<div class="core-item">
        <span class="core-idx">${i}</span>
        <div class="bar-track"><div class="bar-fill" style="width:${v.toFixed(0)}%;background:${c}"></div></div>
        <span class="core-pct" style="color:${c}">${v.toFixed(0)}%</span>
      </div>`;
    });
    html += '</div>';
  }

  html += '</div></div>';

  // ── Memory panel ──
  const memPct = mem.percent ?? 0;
  html += `<div class="panel">
    <div class="panel-head">
      <span class="panel-title">MEMORY</span>
      <span class="panel-val" style="color:var(--purple)">${fmtPct(memPct)}</span>
    </div>
    <div class="panel-body">
      ${bar(memPct, 'var(--purple)', true)}
      <div class="meta-row" style="margin-top:8px">
        <span>Used <span style="color:var(--purple)">${fmtBytes(mem.used)}</span></span>
        <span>Free <span style="color:var(--dim)">${fmtBytes(mem.free)}</span></span>
        <span>Total <span style="color:var(--text)">${fmtBytes(mem.total)}</span></span>
      </div>`;

  if (mem.swap_total > 0) {
    html += `<hr class="divider">
      <div style="display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:6px">
        <span class="metric-label">SWAP</span>
        ${bar(mem.swap_percent, 'var(--orange)')}
        <span style="font-size:11px;color:var(--orange)">${fmtPct(mem.swap_percent)}</span>
      </div>
      <div class="meta-row" style="margin-top:4px">
        <span>Used <span style="color:var(--orange)">${fmtBytes(mem.swap_used)}</span></span>
        <span>Total <span style="color:var(--dim)">${fmtBytes(mem.swap_total)}</span></span>
      </div>`;
  }

  html += '</div></div>';

  // ── GPU panels ──
  gpus.forEach((g, gi) => {
    const gPct = g.util_pct ?? 0;
    const gMemPct = g.mem_total_mb ? (g.mem_used_mb / g.mem_total_mb) * 100 : 0;
    const gpuHist = hist.gpus && hist.gpus[gi] ? hist.gpus[gi] : [];
    const gpuName = (g.name || 'GPU ' + g.index);
    const gpuMetas = [];
    if (g.temp_c != null) gpuMetas.push(`<span class="${tempColor(g.temp_c)}">${g.temp_c}°C</span>`);
    if (g.power_w != null) {
      const pPct = g.power_limit_w ? (g.power_w / g.power_limit_w * 100) : null;
      gpuMetas.push(`<span style="color:${pPct && pPct > 85 ? 'var(--red)' : 'var(--dim)'}">Power ${g.power_w.toFixed(0)}W${g.power_limit_w ? ' / ' + g.power_limit_w.toFixed(0) + 'W' : ''}</span>`);
    }

    html += `<div class="panel">
      <div class="panel-head">
        <span class="panel-title">${esc(gpuName)}</span>
        <span class="panel-val" style="color:var(--blue)">${fmtPct(gPct)}</span>
      </div>
      <div class="panel-body">`;

    if (gpuHist.length > 2) {
      html += `<div class="detail-sparkline">${sparkline(gpuHist, 'var(--blue)', 50)}</div>`;
    }

    html += `<div style="display:grid;grid-template-columns:46px 1fr auto;align-items:center;gap:6px;margin-bottom:6px">
      <span class="metric-label">UTIL</span>
      ${bar(gPct, 'var(--blue)', true)}
      <span style="font-size:11px;color:var(--blue)">${fmtPct(gPct)}</span>
    </div>
    <div style="display:grid;grid-template-columns:46px 1fr auto;align-items:center;gap:6px">
      <span class="metric-label">VRAM</span>
      ${bar(gMemPct, 'var(--teal)', true)}
      <span style="font-size:11px;color:var(--teal)">${fmtBytes((g.mem_used_mb||0)*1048576)}/${fmtBytes((g.mem_total_mb||0)*1048576)}</span>
    </div>`;

    if (gpuMetas.length) html += `<div class="meta-row" style="margin-top:8px">${gpuMetas.map(s=>`<span>${s}</span>`).join('')}</div>`;
    html += '</div></div>';
  });

  // ── Processes panel ──
  if (procs.length > 0) {
    html += `<div class="panel">
      <div class="panel-head">
        <span class="panel-title">TOP PROCESSES</span>
        <span style="font-size:10px;color:var(--dim)">by cpu</span>
      </div>
      <div class="panel-body" style="padding:0">
        <table class="proc-table">
          <thead><tr>
            <th>PID</th><th>NAME</th><th>CPU%</th><th>MEM%</th><th>USER</th>
          </tr></thead>
          <tbody>`;

    procs.slice(0, 20).forEach(p => {
      html += `<tr>
        <td style="color:var(--dim)">${p.pid}</td>
        <td class="proc-name">${esc(p.name)}</td>
        <td class="proc-cpu">${p.cpu.toFixed(1)}</td>
        <td class="proc-mem">${p.mem.toFixed(1)}</td>
        <td style="color:var(--dim);font-size:10px">${esc(p.user)}</td>
      </tr>`;
    });

    html += '</tbody></table></div></div>';
  }

  el.innerHTML = html;
}

// ── Navigation ─────────────────────────────────────────────────────────────
function showSummary() {
  currentNodeId = null;
  document.getElementById('back-btn').style.display = 'none';
  document.getElementById('header-title').textContent = 'FARM MONITOR';
  clearInterval(detailTimer);
  startSummaryPolling();
}

function showDetail(id) {
  currentNodeId = id;
  document.getElementById('back-btn').style.display = '';
  clearInterval(summaryTimer);
  startDetailPolling(id);
}

// ── Polling ────────────────────────────────────────────────────────────────
function getMetricsPort() {
  return window._metricsPort || 19999;
}

async function loadSummary() {
  try {
    const res = await fetch('/api/nodes');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    nodes = await res.json();
    lastUpdate = Date.now();
    renderSummary(nodes);
    updateStatusLine();
  } catch (e) {
    document.getElementById('status-line').textContent = 'error: ' + e.message;
  }
}

async function loadDetail(id) {
  try {
    const res = await fetch('/api/nodes/' + id);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const node = await res.json();
    lastUpdate = Date.now();
    renderDetail(node);
    updateStatusLine();
  } catch (e) {
    document.getElementById('status-line').textContent = 'error: ' + e.message;
  }
}

function startSummaryPolling() {
  loadSummary();
  summaryTimer = setInterval(loadSummary, 5000);
}

function startDetailPolling(id) {
  loadDetail(id);
  detailTimer = setInterval(() => loadDetail(id), 3000);
}

function updateStatusLine() {
  if (!nodes.length) {
    document.getElementById('status-line').textContent = 'no nodes configured';
    return;
  }
  const alive = nodes.filter(n => n.alive).length;
  document.getElementById('status-line').textContent =
    alive + '/' + nodes.length + ' alive · ' + fmtAge(lastUpdate);
}

// ── Clock ──────────────────────────────────────────────────────────────────
function tickClock() {
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  if (lastUpdate) updateStatusLine();
}
setInterval(tickClock, 1000);
tickClock();

// ── Escape HTML ────────────────────────────────────────────────────────────
function esc(s) {
  return String(s || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ── Boot ───────────────────────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}

startSummaryPolling();
</script>
</body>
</html>
