<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LinkCurator">
<title>LinkCurator</title>
<link rel="manifest" href="/manifest.json">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f172a;
    --surface: #1e293b;
    --surface2: #334155;
    --border: #334155;
    --text: #f1f5f9;
    --text-muted: #94a3b8;
    --accent: #7c3aed;
    --accent-light: #a78bfa;
    --danger: #ef4444;
    --success: #10b981;
    --cat-claude: #8B5CF6;
    --cat-research: #3B82F6;
    --cat-tools: #10B981;
    --cat-community: #F59E0B;
    --cat-safety: #EF4444;
    --cat-industry: #06B6D4;
    --cat-tutorials: #6366F1;
    --cat-misc: #6B7280;
    --bottom-nav-h: 64px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; overscroll-behavior: none; }

  #app { display: flex; flex-direction: column; height: 100dvh; }

  /* Header */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px 10px;
    padding-top: calc(14px + env(safe-area-inset-top, 0px));
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }
  .header-brand { display: flex; align-items: center; gap: 8px; }
  .header-logo { width: 28px; height: 28px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
  header h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
  .header-stats { font-size: 12px; color: var(--text-muted); display: flex; gap: 10px; }
  .stat-badge { background: var(--surface2); padding: 3px 8px; border-radius: 99px; font-weight: 600; }
  .stat-badge.unread { background: var(--accent); color: white; }

  /* Tab content area */
  #tab-content { flex: 1; overflow: hidden; position: relative; }
  .tab-pane { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior-y: contain; display: none; padding-bottom: calc(var(--bottom-nav-h) + var(--safe-bottom) + 16px); }
  .tab-pane.active { display: block; }

  /* Bottom nav */
  nav {
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    height: calc(var(--bottom-nav-h) + var(--safe-bottom));
    padding-bottom: var(--safe-bottom);
    flex-shrink: 0;
  }
  .nav-btn {
    flex: 1; background: none; border: none; color: var(--text-muted);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; font-size: 10px; font-weight: 600; letter-spacing: 0.3px;
    cursor: pointer; transition: color 0.15s; position: relative; text-transform: uppercase;
  }
  .nav-btn svg { width: 22px; height: 22px; }
  .nav-btn.active { color: var(--accent-light); }
  .nav-badge {
    position: absolute; top: 8px; right: calc(50% - 18px);
    background: var(--danger); color: white; font-size: 9px; font-weight: 700;
    border-radius: 99px; padding: 1px 5px; min-width: 16px; text-align: center;
    display: none;
  }
  .nav-badge.visible { display: block; }

  /* Cards */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px; margin: 12px 14px 0;
    position: relative; overflow: hidden;
  }
  .card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--cat-color, var(--accent)); border-radius: 3px 0 0 3px; }
  .card.read { opacity: 0.55; }
  .card-title { font-size: 15px; font-weight: 600; line-height: 1.3; margin-bottom: 6px; }
  .card-title a { color: var(--text); text-decoration: none; }
  .card-title a:hover { color: var(--accent-light); }
  .card-summary { font-size: 13px; color: var(--text-muted); line-height: 1.5; margin-bottom: 10px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .card-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .source-badge { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 99px; background: var(--surface2); color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .source-badge.reddit { background: #ff4500; color: white; }
  .source-badge.x, .source-badge.twitter { background: #000; color: white; border: 1px solid #333; }
  .source-badge.youtube { background: #ff0000; color: white; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: rgba(124,58,237,0.15); color: var(--accent-light); font-weight: 500; }
  .card-time { font-size: 11px; color: var(--text-muted); margin-left: auto; }
  .card-actions { display: flex; gap: 8px; margin-top: 10px; }
  .btn-sm {
    font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 8px;
    border: none; cursor: pointer; transition: opacity 0.15s;
  }
  .btn-sm:active { opacity: 0.7; }
  .btn-read { background: var(--surface2); color: var(--text-muted); }
  .btn-read.done { background: rgba(16,185,129,0.15); color: var(--success); }
  .btn-delete { background: rgba(239,68,68,0.1); color: var(--danger); }
  .btn-open { background: rgba(124,58,237,0.15); color: var(--accent-light); margin-left: auto; }

  /* Category sections */
  .cat-section { margin-top: 20px; }
  .cat-header {
    display: flex; align-items: center; gap: 8px;
    padding: 0 14px 6px; position: sticky; top: 0; z-index: 2;
    background: var(--bg); backdrop-filter: blur(8px);
  }
  .cat-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .cat-name { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
  .cat-count { font-size: 12px; color: var(--text-muted); background: var(--surface2); padding: 1px 7px; border-radius: 99px; }

  /* Save tab */
  .save-form { padding: 16px; }
  .field-label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 6px; }
  .url-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .url-input {
    flex: 1; background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 14px; color: var(--text); font-size: 15px;
    outline: none; transition: border-color 0.15s;
  }
  .url-input:focus { border-color: var(--accent); }
  .url-input::placeholder { color: var(--text-muted); }
  .btn-paste {
    background: var(--surface2); border: 1px solid var(--border); border-radius: 10px;
    color: var(--text-muted); font-size: 12px; font-weight: 600; padding: 0 12px;
    cursor: pointer; white-space: nowrap; transition: background 0.15s;
  }
  .btn-paste:active { background: var(--surface); }
  .note-input {
    width: 100%; background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 14px; color: var(--text); font-size: 14px;
    outline: none; resize: none; font-family: inherit; transition: border-color 0.15s;
    margin-bottom: 12px;
  }
  .note-input:focus { border-color: var(--accent); }
  .btn-save {
    width: 100%; background: var(--accent); color: white; border: none;
    border-radius: 12px; padding: 14px; font-size: 16px; font-weight: 700;
    cursor: pointer; transition: opacity 0.15s; letter-spacing: -0.2px;
  }
  .btn-save:active { opacity: 0.85; }
  .btn-save:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Processing card */
  .processing-card { border: 1px dashed var(--border); border-radius: 12px; padding: 14px; margin: 12px 14px 0; }
  .processing-url { font-size: 12px; color: var(--text-muted); word-break: break-all; margin-bottom: 8px; }
  .processing-row { display: flex; align-items: center; gap: 8px; }
  .spinner { width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; flex-shrink: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .processing-text { font-size: 13px; color: var(--text-muted); }

  /* Digest header */
  .digest-header { padding: 12px 14px; display: flex; align-items: center; gap: 10px; }
  .date-nav { display: flex; align-items: center; gap: 8px; }
  .btn-nav { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; color: var(--text-muted); padding: 6px 10px; font-size: 16px; cursor: pointer; }
  .btn-nav:active { background: var(--surface2); }
  .date-label { font-size: 14px; font-weight: 700; flex: 1; text-align: center; }
  .digest-total { font-size: 12px; color: var(--text-muted); }

  /* Browse */
  .browse-controls { padding: 12px 14px; position: sticky; top: 0; z-index: 3; background: var(--bg); }
  .search-input {
    width: 100%; background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 14px; color: var(--text); font-size: 15px;
    outline: none; transition: border-color 0.15s; margin-bottom: 10px;
  }
  .search-input:focus { border-color: var(--accent); }
  .filter-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .filter-row::-webkit-scrollbar { display: none; }
  .filter-chip {
    flex-shrink: 0; background: var(--surface); border: 1px solid var(--border);
    border-radius: 99px; padding: 5px 12px; font-size: 12px; font-weight: 600;
    color: var(--text-muted); cursor: pointer; white-space: nowrap; transition: all 0.15s;
  }
  .filter-chip.active { background: var(--accent); border-color: var(--accent); color: white; }
  .filter-chip.unread-toggle { border-color: var(--success); color: var(--success); }
  .filter-chip.unread-toggle.active { background: var(--success); color: white; }

  /* Empty state */
  .empty { text-align: center; padding: 48px 24px; color: var(--text-muted); }
  .empty-icon { font-size: 48px; margin-bottom: 12px; }
  .empty h3 { font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
  .empty p { font-size: 14px; line-height: 1.5; }

  /* Load more */
  .load-more-wrap { padding: 16px; text-align: center; }
  .btn-load-more { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; color: var(--text-muted); font-size: 13px; font-weight: 600; padding: 10px 24px; cursor: pointer; }

  /* Toast */
  #toast {
    position: fixed; bottom: calc(var(--bottom-nav-h) + var(--safe-bottom) + 12px);
    left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 18px; font-size: 13px; font-weight: 600; color: var(--text);
    box-shadow: 0 8px 24px rgba(0,0,0,0.4); opacity: 0; transition: all 0.2s;
    z-index: 100; white-space: nowrap; pointer-events: none;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.success { border-color: var(--success); color: var(--success); }
  #toast.error { border-color: var(--danger); color: var(--danger); }

  /* Section divider */
  .section-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); padding: 16px 14px 4px; }

  @media (min-width: 640px) {
    .card { margin-left: auto; margin-right: auto; max-width: 600px; }
    .cat-header { max-width: 600px; margin: 0 auto; }
    .save-form { max-width: 600px; margin: 0 auto; }
    .digest-header { max-width: 600px; margin: 0 auto; }
    .browse-controls { max-width: 600px; margin: 0 auto; }
    .load-more-wrap { max-width: 600px; margin: 0 auto; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="header-brand">
      <div class="header-logo">🔗</div>
      <h1>LinkCurator</h1>
    </div>
    <div class="header-stats">
      <span class="stat-badge unread" id="hdr-unread" style="display:none"></span>
      <span class="stat-badge" id="hdr-today">0 today</span>
    </div>
  </header>

  <div id="tab-content">
    <!-- SAVE TAB -->
    <div class="tab-pane active" id="pane-save">
      <div class="save-form">
        <div class="field-label">URL</div>
        <div class="url-row">
          <input class="url-input" id="url-input" type="url" placeholder="https://..." autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">
          <button class="btn-paste" id="btn-paste">Paste</button>
        </div>
        <div class="field-label">Note (optional)</div>
        <textarea class="note-input" id="note-input" rows="2" placeholder="Why is this interesting?"></textarea>
        <button class="btn-save" id="btn-save">Save & Classify</button>
      </div>

      <div class="section-label">Recent Saves</div>
      <div id="recent-saves"></div>
    </div>

    <!-- DIGEST TAB -->
    <div class="tab-pane" id="pane-digest">
      <div class="digest-header">
        <button class="btn-nav" id="digest-prev">‹</button>
        <div>
          <div class="date-label" id="digest-date-label">Today</div>
          <div class="digest-total" id="digest-total"></div>
        </div>
        <button class="btn-nav" id="digest-next">›</button>
      </div>
      <div id="digest-content"></div>
    </div>

    <!-- BROWSE TAB -->
    <div class="tab-pane" id="pane-browse">
      <div class="browse-controls">
        <input class="search-input" id="search-input" type="search" placeholder="Search links...">
        <div class="filter-row" id="filter-row">
          <button class="filter-chip active" data-cat="">All</button>
          <button class="filter-chip unread-toggle" id="unread-toggle">Unread</button>
        </div>
      </div>
      <div id="browse-list"></div>
      <div class="load-more-wrap" id="load-more-wrap" style="display:none">
        <button class="btn-load-more" id="btn-load-more">Load more</button>
      </div>
    </div>
  </div>

  <nav>
    <button class="nav-btn active" data-tab="save" id="nav-save">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      Save
    </button>
    <button class="nav-btn" data-tab="digest" id="nav-digest">
      <div class="nav-badge" id="digest-badge"></div>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      Digest
    </button>
    <button class="nav-btn" data-tab="browse" id="nav-browse">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      Browse
    </button>
  </nav>
</div>

<div id="toast"></div>

<script>
// ─── Constants ───────────────────────────────────────────────────────────────
const CAT_COLORS = {
  'Claude & Anthropic':   '#8B5CF6',
  'AI Research & Papers': '#3B82F6',
  'AI Tools & Products':  '#10B981',
  'Community Discussions':'#F59E0B',
  'AI Safety & Ethics':   '#EF4444',
  'AI in Industry':       '#06B6D4',
  'Tutorials & How-tos':  '#6366F1',
  'Miscellaneous':        '#6B7280',
};

function catColor(cat) { return CAT_COLORS[cat] || '#6B7280'; }

function sourceBadgeClass(source) {
  if (!source) return '';
  const s = source.toLowerCase();
  if (s === 'reddit') return 'reddit';
  if (s === 'x' || s === 'twitter' || s.includes('twitter') || s.includes('x.com')) return 'x';
  if (s === 'youtube') return 'youtube';
  return '';
}

function sourceBadgeLabel(source) {
  if (!source) return 'WEB';
  const s = source.toLowerCase();
  if (s === 'reddit') return 'Reddit';
  if (s === 'x' || s === 'twitter' || s.includes('twitter')) return '𝕏';
  if (s === 'youtube') return 'YT';
  return source.toUpperCase().slice(0, 8);
}

function timeAgo(ts) {
  const diff = Date.now() - new Date(ts).getTime();
  const m = Math.floor(diff / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return `${m}m ago`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h}h ago`;
  return `${Math.floor(h / 24)}d ago`;
}

function domainOf(url) {
  try { return new URL(url).hostname.replace(/^www\./, ''); } catch { return url; }
}

// ─── Toast ───────────────────────────────────────────────────────────────────
let toastTimer;
function toast(msg, type = 'default') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `show${type !== 'default' ? ' ' + type : ''}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = ''; }, 2500);
}

// ─── API helpers ─────────────────────────────────────────────────────────────
async function api(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(path, opts);
  return res.json();
}

// ─── Tab routing ─────────────────────────────────────────────────────────────
let activeTab = 'save';
function switchTab(tab) {
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(`pane-${tab}`).classList.add('active');
  document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
  activeTab = tab;
  if (tab === 'digest') renderDigest();
  if (tab === 'browse') renderBrowse(true);
}

document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', () => switchTab(btn.dataset.tab));
});

// ─── Stats ───────────────────────────────────────────────────────────────────
async function refreshStats() {
  try {
    const stats = await api('GET', '/api/stats');
    const hdrUnread = document.getElementById('hdr-unread');
    const hdrToday = document.getElementById('hdr-today');
    const digestBadge = document.getElementById('digest-badge');

    hdrToday.textContent = `${stats.today || 0} today`;
    if (stats.unread > 0) {
      hdrUnread.textContent = `${stats.unread} unread`;
      hdrUnread.style.display = '';
      digestBadge.textContent = stats.unread;
      digestBadge.classList.add('visible');
    } else {
      hdrUnread.style.display = 'none';
      digestBadge.classList.remove('visible');
    }
  } catch (e) { /* ignore */ }
}

// ─── Card rendering ──────────────────────────────────────────────────────────
function renderCard(link, opts = {}) {
  const color = catColor(link.category);
  const tags = Array.isArray(link.tags) ? link.tags : JSON.parse(link.tags || '[]');
  const src = (link.source || 'web').toLowerCase();

  const div = document.createElement('div');
  div.className = `card${link.read ? ' read' : ''}`;
  div.style.setProperty('--cat-color', color);
  div.dataset.id = link.id;

  div.innerHTML = `
    <div class="card-title"><a href="${link.url}" target="_blank" rel="noopener">${link.title || domainOf(link.url)}</a></div>
    ${link.summary ? `<div class="card-summary">${link.summary}</div>` : ''}
    <div class="card-meta">
      <span class="source-badge ${sourceBadgeClass(src)}">${sourceBadgeLabel(src)}</span>
      ${tags.map(t => `<span class="tag">${t}</span>`).join('')}
      <span class="card-time">${timeAgo(link.created_at)}</span>
    </div>
    <div class="card-actions">
      <button class="btn-sm btn-read ${link.read ? 'done' : ''}" data-action="read">${link.read ? '✓ Read' : 'Mark Read'}</button>
      <button class="btn-sm btn-delete" data-action="delete">Delete</button>
      <a href="${link.url}" target="_blank" rel="noopener" class="btn-sm btn-open">Open ↗</a>
    </div>
  `;

  div.querySelector('[data-action="read"]').addEventListener('click', async () => {
    const newRead = !link.read;
    await api('PATCH', `/api/links/${link.id}`, { read: newRead });
    link.read = newRead;
    div.className = `card${newRead ? ' read' : ''}`;
    div.querySelector('[data-action="read"]').className = `btn-sm btn-read${newRead ? ' done' : ''}`;
    div.querySelector('[data-action="read"]').textContent = newRead ? '✓ Read' : 'Mark Read';
    refreshStats();
  });

  div.querySelector('[data-action="delete"]').addEventListener('click', async () => {
    await api('DELETE', `/api/links/${link.id}`);
    div.remove();
    toast('Deleted', 'error');
    refreshStats();
    if (activeTab === 'digest') renderDigest();
  });

  return div;
}

// ─── SAVE TAB ────────────────────────────────────────────────────────────────
const pendingPolls = new Map();

document.getElementById('btn-paste').addEventListener('click', async () => {
  try {
    const text = await navigator.clipboard.readText();
    const urlMatch = text.match(/https?:\/\/\S+/);
    if (urlMatch) document.getElementById('url-input').value = urlMatch[0];
    else document.getElementById('url-input').value = text.trim();
  } catch {
    toast('Paste denied — paste manually', 'error');
  }
});

document.getElementById('btn-save').addEventListener('click', async () => {
  const url = document.getElementById('url-input').value.trim();
  const note = document.getElementById('note-input').value.trim();
  if (!url.startsWith('http')) { toast('Enter a valid URL starting with http', 'error'); return; }

  const btn = document.getElementById('btn-save');
  btn.disabled = true;
  btn.textContent = 'Saving...';

  try {
    const data = await api('POST', '/api/links', { url, note });
    document.getElementById('url-input').value = '';
    document.getElementById('note-input').value = '';
    toast('Saved! AI is classifying...', 'success');
    addProcessingCard(data.id, url);
    pollLink(data.id);
    refreshStats();
  } catch (e) {
    toast('Error saving link', 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Save & Classify';
  }
});

function addProcessingCard(id, url) {
  const wrap = document.getElementById('recent-saves');
  const div = document.createElement('div');
  div.className = 'processing-card';
  div.id = `proc-${id}`;
  div.innerHTML = `
    <div class="processing-url">${url}</div>
    <div class="processing-row">
      <div class="spinner"></div>
      <span class="processing-text">AI is reading and classifying...</span>
    </div>
  `;
  wrap.prepend(div);
}

async function pollLink(id) {
  if (pendingPolls.has(id)) return;
  const intervalId = setInterval(async () => {
    try {
      const data = await api('GET', `/api/links/${id}/status`);
      if (data.status === 'done' || data.status === 'error') {
        clearInterval(intervalId);
        pendingPolls.delete(id);
        const proc = document.getElementById(`proc-${id}`);
        if (proc) {
          if (data.status === 'done') {
            proc.replaceWith(renderCard(data));
          } else {
            proc.querySelector('.processing-text').textContent = 'Classification failed — link saved without tags';
            proc.querySelector('.spinner').style.display = 'none';
          }
        }
        refreshStats();
      }
    } catch (e) { /* ignore */ }
  }, 2000);
  pendingPolls.set(id, intervalId);
}

// ─── DIGEST TAB ──────────────────────────────────────────────────────────────
let digestDate = new Date().toISOString().split('T')[0];

function formatDateLabel(dateStr) {
  const today = new Date().toISOString().split('T')[0];
  const yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];
  if (dateStr === today) return 'Today';
  if (dateStr === yesterday) return 'Yesterday';
  return new Date(dateStr + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
}

document.getElementById('digest-prev').addEventListener('click', () => {
  digestDate = new Date(new Date(digestDate).getTime() - 86400000).toISOString().split('T')[0];
  renderDigest();
});
document.getElementById('digest-next').addEventListener('click', () => {
  const next = new Date(new Date(digestDate).getTime() + 86400000).toISOString().split('T')[0];
  const today = new Date().toISOString().split('T')[0];
  if (next <= today) { digestDate = next; renderDigest(); }
});

async function renderDigest() {
  document.getElementById('digest-date-label').textContent = formatDateLabel(digestDate);
  const content = document.getElementById('digest-content');
  content.innerHTML = '<div class="empty"><div class="empty-icon">⏳</div><p>Loading...</p></div>';

  try {
    const data = await api('GET', `/api/digest?date=${digestDate}`);
    document.getElementById('digest-total').textContent = data.total ? `${data.total} links` : '';
    content.innerHTML = '';

    const cats = Object.keys(data.categories);
    if (cats.length === 0) {
      content.innerHTML = `<div class="empty">
        <div class="empty-icon">📭</div>
        <h3>No links for this day</h3>
        <p>Save some links and they'll appear here, grouped by topic.</p>
      </div>`;
      return;
    }

    for (const cat of cats) {
      const links = data.categories[cat];
      const color = catColor(cat);
      const section = document.createElement('div');
      section.className = 'cat-section';
      section.innerHTML = `
        <div class="cat-header">
          <div class="cat-dot" style="background:${color}"></div>
          <span class="cat-name" style="color:${color}">${cat}</span>
          <span class="cat-count">${links.length}</span>
        </div>
      `;
      for (const link of links) section.appendChild(renderCard(link));
      content.appendChild(section);
    }
  } catch (e) {
    content.innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div><p>Failed to load digest.</p></div>';
  }
}

// Pull-to-refresh on digest
let ptStartY = 0;
const digestPane = document.getElementById('pane-digest');
digestPane.addEventListener('touchstart', e => { ptStartY = e.touches[0].clientY; }, { passive: true });
digestPane.addEventListener('touchend', e => {
  const dy = e.changedTouches[0].clientY - ptStartY;
  if (dy > 60 && digestPane.scrollTop === 0) renderDigest();
}, { passive: true });

// ─── BROWSE TAB ──────────────────────────────────────────────────────────────
let browseOffset = 0;
let browseCategory = '';
let browseUnread = false;
let browseSearch = '';
let browseSearchTimer;

async function renderBrowse(reset = false) {
  if (reset) {
    browseOffset = 0;
    document.getElementById('browse-list').innerHTML = '';
  }

  try {
    const params = new URLSearchParams({ limit: 20, offset: browseOffset });
    if (browseSearch) params.set('search', browseSearch);
    if (browseCategory) params.set('category', browseCategory);
    if (browseUnread) params.set('unread', '1');

    const links = await api('GET', `/api/links?${params}`);
    const list = document.getElementById('browse-list');

    if (browseOffset === 0 && links.length === 0) {
      list.innerHTML = `<div class="empty">
        <div class="empty-icon">🔍</div>
        <h3>No links found</h3>
        <p>Try a different search or save some links first.</p>
      </div>`;
      document.getElementById('load-more-wrap').style.display = 'none';
      return;
    }

    for (const link of links) list.appendChild(renderCard(link));
    browseOffset += links.length;
    document.getElementById('load-more-wrap').style.display = links.length === 20 ? '' : 'none';
  } catch (e) { toast('Failed to load links', 'error'); }
}

async function loadCategories() {
  try {
    const cats = await api('GET', '/api/categories');
    const row = document.getElementById('filter-row');
    cats.forEach(({ category, unread }) => {
      const btn = document.createElement('button');
      btn.className = 'filter-chip';
      btn.dataset.cat = category;
      btn.innerHTML = `${category} <span style="opacity:0.6;font-size:10px">${unread > 0 ? `(${unread})` : ''}</span>`;
      btn.addEventListener('click', () => {
        browseCategory = btn.dataset.cat;
        document.querySelectorAll('.filter-chip:not(.unread-toggle)').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        renderBrowse(true);
      });
      row.appendChild(btn);
    });
  } catch (e) { /* ignore */ }
}

document.getElementById('search-input').addEventListener('input', e => {
  clearTimeout(browseSearchTimer);
  browseSearchTimer = setTimeout(() => {
    browseSearch = e.target.value.trim();
    renderBrowse(true);
  }, 300);
});

document.querySelector('[data-cat=""]').addEventListener('click', () => {
  browseCategory = '';
  document.querySelectorAll('.filter-chip:not(.unread-toggle)').forEach(c => c.classList.remove('active'));
  document.querySelector('[data-cat=""]').classList.add('active');
  renderBrowse(true);
});

document.getElementById('unread-toggle').addEventListener('click', function() {
  browseUnread = !browseUnread;
  this.classList.toggle('active', browseUnread);
  renderBrowse(true);
});

document.getElementById('btn-load-more').addEventListener('click', () => renderBrowse(false));

// ─── Init ────────────────────────────────────────────────────────────────────
refreshStats();
loadCategories();
setInterval(refreshStats, 30000);

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
</script>
</body>
